# Trowel CI: the repository's own gate, `cargo xtask ci` (fmt, clippy -D warnings, every test,
# assets, brands, layers and the wasm check), on Linux, and a Windows x64 release build kept as a
# download. Runs on every push to a work branch (`claude/**`), on pull requests and by hand. It
# pushes, publishes and deploys nothing: the token can only read the repository.
name: Trowel CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: trowel-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info in test builds: with it the target directory outgrows a hosted runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  gate:
    name: cargo xtask ci (Linux)
    # A pull request from one of this repository's `claude/**` branches already runs on push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The toolchain the local `cargo xtask ci` gate runs, so a new stable release's lints can't
      # turn CI red on their own. Raise it together with the local toolchain.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: trowel-ci-linux
      - name: cargo xtask ci
        run: cargo xtask ci

  windows:
    name: Windows x64 release build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'claude/')
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: trowel-ci-windows
      # Built as packaging/windows/package.ps1 builds the x64 release: static CRT (no VC++
      # redistributable needed), the icon and VERSIONINFO required, the lockfile respected.
      - name: Build
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
          VECTORCRAFT_REQUIRE_WINRES: "1"
        run: cargo build --release --locked -p vectorcraft -p vectorcraft-cli --target x86_64-pc-windows-msvc
      - name: Run the CLI once
        shell: pwsh
        run: |
          $out = & ./target/x86_64-pc-windows-msvc/release/vectorcraft-cli.exe --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Output $out; throw "vectorcraft-cli --version exited $LASTEXITCODE" }
          Write-Output "ok vectorcraft-cli --version: $($out.Trim())"
      - uses: actions/upload-artifact@v7
        with:
          name: trowel-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/vectorcraft.exe
            target/x86_64-pc-windows-msvc/release/vectorcraft-cli.exe
          if-no-files-found: error
          retention-days: 14
